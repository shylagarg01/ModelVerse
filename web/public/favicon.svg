<svg viewBox="10 16 84 66" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Top Face Gradient -->
    <linearGradient id="mv-favicon-top" x1="26" y1="20" x2="74" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D4419" />
      <stop offset="50%" stop-color="#1B2910" />
      <stop offset="100%" stop-color="#121C0A" />
    </linearGradient>

    <!-- M on Left Face Gradient -->
    <linearGradient id="mv-favicon-m-grad" x1="26" y1="34" x2="50" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C5F467" />
      <stop offset="50%" stop-color="#55D875" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <!-- V on Right Face Gradient -->
    <linearGradient id="mv-favicon-v-grad" x1="50" y1="48" x2="74" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.55" />
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="mv-favicon-ring" x1="12" y1="66" x2="88" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#C5F467" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#4ADE80" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Emerald Glow Filter -->
    <filter id="mv-favicon-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital Ring: Back Arc (behind top-right of cube) -->
  <path d="M 17 62 C 12 55, 18 45, 38 40 C 58 35, 78 33.5, 88 37 C 91.5 38.2, 92 40, 90 42"
        stroke="url(#mv-favicon-ring)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Cube Core Faces (Dark base structure) -->
  <!-- Top Face -->
  <path d="M 50 20 L 74 34 L 50 48 L 26 34 Z" fill="url(#mv-favicon-top)" stroke="#3D5A22" stroke-width="0.8" stroke-linejoin="round" />
  <!-- Left Face Base -->
  <path d="M 26 34 L 50 48 L 50 78 L 26 64 Z" fill="#141E0F" stroke="#223318" stroke-width="0.5" stroke-linejoin="round" />
  <!-- Right Face Base -->
  <path d="M 50 48 L 74 34 L 74 64 L 50 78 Z" fill="#0F170C" stroke="#1F2F16" stroke-width="0.5" stroke-linejoin="round" />

  <!-- Left Face: Bold Geometric 'M' Integrated in 3D Perspective -->
  <!-- Left pillar -->
  <path d="M 27.5 37 L 33 40.2 L 33 64.5 L 27.5 61.5 Z" fill="url(#mv-favicon-m-grad)" />
  <!-- Left inner diagonal -->
  <path d="M 33 40.2 L 37.5 54 L 33 60 L 33 40.2 Z" fill="url(#mv-favicon-m-grad)" opacity="0.9" />
  <!-- Center vertex to right inner diagonal -->
  <path d="M 37.5 54 L 43.5 46.2 L 43.5 55.5 L 37.5 64 Z" fill="url(#mv-favicon-m-grad)" opacity="0.95" />
  <!-- Right pillar along center spine -->
  <path d="M 43.5 46.2 L 48.5 49 L 48.5 73.5 L 43.5 70.5 Z" fill="url(#mv-favicon-m-grad)" />

  <!-- Right Face: Stylized 'V' in 3D Perspective -->
  <!-- Left arm of V -->
  <path d="M 51.5 51.5 L 56.5 48.5 L 62.5 68 L 57.5 71 Z" fill="url(#mv-favicon-v-grad)" />
  <!-- Right arm of V -->
  <path d="M 67.5 42 L 72.5 39 L 66 73 L 61 73 Z" fill="url(#mv-favicon-v-grad)" />
  <!-- Specular inner highlight on V -->
  <path d="M 56.5 48.5 L 67.5 42 L 62.5 68 Z" fill="#A7F3D0" fill-opacity="0.12" />

  <!-- Cube Edge Bevel Highlights -->
  <path d="M 26 34 L 50 48 L 74 34" stroke="#65A30D" stroke-width="0.75" stroke-linecap="round" opacity="0.8" />
  <path d="M 50 48 L 50 78" stroke="#84CC16" stroke-width="0.75" stroke-linecap="round" opacity="0.6" />

  <!-- Orbital Ring: Front Arc (in front of cube lower-left) -->
  <path d="M 90 42 C 92 46, 84 53, 67 59.5 C 47 66.5, 23 70.5, 17 62"
        stroke="url(#mv-favicon-ring)" stroke-width="2" stroke-linecap="round" filter="url(#mv-favicon-glow)" />

  <!-- 4-Point Diamond Sparkle Star at Top-Right of Orbit (~80, 35) -->
  <g transform="translate(80, 35)" filter="url(#mv-favicon-glow)">
    <!-- Star Glow Backing -->
    <circle cx="0" cy="0" r="3" fill="#C5F467" opacity="0.5" />
    <!-- 4-Point Star Rays -->
    <path d="M 0 -6 Q 0 0 -6 0 Q 0 0 0 6 Q 0 0 6 0 Q 0 0 0 -6 Z" fill="#FFFFFF" />
    <!-- Center core -->
    <circle cx="0" cy="0" r="1.3" fill="#C5F467" />
  </g>
</svg>